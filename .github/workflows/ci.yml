name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd cre/sentinel-verdict && bun install --frozen-lockfile

      - name: Generate random parity vectors
        run: bun run vectors:random

      - name: No unverified facts in the README
        run: |
          if grep -nE '\[VERIFY\]|TODO-VERIFY' README.md; then
            echo "README.md still holds a VERIFY marker"
            exit 1
          fi

      - name: Solidity format
        run: forge fmt --check
        working-directory: contracts

      - name: Foundry tests
        working-directory: contracts
        run: forge test -vvv

      - name: Bun tests
        run: bun test

      - name: Typecheck
        run: bun run typecheck
