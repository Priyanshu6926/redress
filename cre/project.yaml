# CRE project settings. RPC URLs come from the environment, never from this file.
#
# fork: reads and writes a local Anvil fork of mainnet.
# sepolia: reads mainnet history and writes the Sepolia vault.
fork:
  rpcs:
    - chain-name: ethereum-mainnet
      url: http://127.0.0.1:8545

sepolia:
  rpcs:
    - chain-name: ethereum-mainnet
      url: ${MAINNET_RPC}
    - chain-name: ethereum-testnet-sepolia
      url: ${SEPOLIA_RPC}

# demo-v4hook: reads mainnet history and the synthetic Sepolia hook pool. Never writes.
demo-v4hook:
  rpcs:
    - chain-name: ethereum-mainnet
      url: ${MAINNET_RPC}
    - chain-name: ethereum-testnet-sepolia
      url: ${SEPOLIA_RPC}
